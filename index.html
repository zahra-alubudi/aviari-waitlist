<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aviari</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"/>
<link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32"/>
<link rel="icon" href="/favicon.ico?v=2" sizes="any"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2"/>
<!-- The site lives at /waitlist for now. Sending the apex there rather than
     404ing means anyone who types the bare domain still lands somewhere real.
     Replace this file when there is a proper landing page for the root. -->
<link rel="canonical" href="https://aviari.co/waitlist/"/>
<!-- Scrapers do not follow the meta-refresh, so the apex needs its own
     preview or a shared "aviari.co" link renders bare. -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="Aviari"/>
<meta property="og:url" content="https://aviari.co/waitlist/"/>
<meta property="og:title" content="All 9 PPL exams in 12 weeks | Aviari"/>
<meta property="og:description" content="A week-by-week plan for all nine UK CAA and EASA theory exams, with notes, flashcards, audio and mocks. Join the waitlist to lock in the launch price."/>
<meta property="og:image" content="https://aviari.co/waitlist/og.jpg"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://aviari.co/waitlist/og.jpg"/>
<meta http-equiv="refresh" content="0; url=/waitlist/"/>
<script>window.location.replace('/waitlist/')</script>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f6f9fc; color: #4a6b88;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px;
  }
  a { color: #1a2a3d; }
</style>

<!-- Privacy-friendly analytics by Plausible. Cookieless, so no consent
     banner is required and nothing is asked of the visitor before they see
     the page. Loaded on both the apex stub and the waitlist page so a visit
     is counted whichever URL was shared. -->
<script async src="https://plausible.io/js/pa-zaWJjR7W3w_GFTTVy_LaS.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>
  <!-- Only seen if both the redirect and the script are blocked. -->
  <p>Taking you to the waitlist &mdash; <a href="/waitlist/">continue</a>.</p>
</body>
</html>
